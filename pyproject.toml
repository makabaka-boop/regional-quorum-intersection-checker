[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quorum-analyzer"
version = "0.1.0"
description = "Analyze weighted, datacenter-constrained read/write quorum intersection"
requires-python = ">=3.10"

[project.scripts]
quorum-analyzer = "quorum_analyzer.cli:main"

[tool.setuptools.packages.find]
include = ["quorum_analyzer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
